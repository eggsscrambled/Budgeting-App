<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Transaction</title>

    <link rel="stylesheet" href="Main.css">
    <link rel="stylesheet" href="Add.css">

</head>


<body>

  <div id="scale-stage">

       <div class = "Wrapper Round">

              <div class = "AddCard Round">
                     <div class = "Round Label">
                             <p class="WelcomeText"> Add Transaction </p>
                     </div>

                     <div class="AddForm">

                            <div class="AccountsPanel">
                                   <div class="LeftPanelTabs">
                                          <button type="button" class="TabBtn active" id="tabAccountsBtn">Accounts</button>
                                          <button type="button" class="TabBtn" id="tabCategoriesBtn">Categories</button>
                                   </div>

                                   <div id="accountsSubPanel" class="SubPanel active">
                                          <div class="AccountsHeader">
                                                 <span class="SectionTitle">Your Accounts</span>
                                                 <div class="NewAccountRow">
                                                        <input type="text" id="newAccountName" placeholder="New account name">
                                                        <input type="color" id="newAccountColor" value="#3a86f0" title="Choose account color" class="ColorCirclePicker">
                                                        <button type="button" class="SmallBtn" id="createAccountBtn">+ Add</button>
                                                 </div>
                                          </div>
                                          <div class="AccountList" id="accountList">
                                                 <p class="NoAccountsMsg" id="noAccountsMsg">No accounts yet — create one to get started.</p>
                                          </div>
                                   </div>

                                   <div id="categoriesSubPanel" class="SubPanel">
                                          <div class="AccountsHeader">
                                                 <span class="SectionTitle">Category Settings</span>
                                                 <div class="NewCategoryRow">
                                                        <input type="text" id="newCategoryName" placeholder="New category name">
                                                        <select id="newCategoryType" class="TabSelect">
                                                               <option value="expense">Expense</option>
                                                               <option value="income">Income</option>
                                                        </select>
                                                        <input type="color" id="newCategoryColor" value="#9b5de5" title="Choose category color" class="ColorCirclePicker">
                                                        <button type="button" class="SmallBtn" id="createCategoryBtn">+ Add</button>
                                                 </div>
                                          </div>
                                          <div class="CategoryColorList" id="categoryColorList">
                                                 <!-- Populated dynamically in JS -->
                                          </div>
                                   </div>
                            </div>

                            <div class="TransactionSection">
                                   <div class="EntryToggle">
                                          <button type="button" class="ToggleBtn income active" id="incomeBtn">Income</button>
                                          <button type="button" class="ToggleBtn expense" id="expenseBtn">Expense</button>
                                          <button type="button" class="ToggleBtn transfer" id="transferBtn">Transfer</button>
                                   </div>

                                   <div class="FormGrid">
                                          <div class="FormField" id="accountField">
                                                 <label for="account" id="accountLabel">Account</label>
                                                 <select id="account"></select>
                                          </div>
                                          <div class="FormField" id="toAccountField" style="display: none;">
                                                 <label for="toAccount">To Account</label>
                                                 <select id="toAccount"></select>
                                          </div>
                                          <div class="FormField">
                                                 <label for="amount">Amount</label>
                                                 <input type="number" id="amount" placeholder="0.00" min="0" step="0.01">
                                          </div>
                                          <div class="FormField" id="categoryField">
                                                 <label for="category">Category</label>
                                                 <select id="category"></select>
                                          </div>
                                          <div class="FormField">
                                                 <label for="date">Date</label>
                                                 <input type="date" id="date">
                                          </div>
                                          <div class="FormField FormField--full">
                                                 <label for="description">Description</label>
                                                 <input type="text" id="description" placeholder="e.g. Grocery shopping">
                                          </div>
                                   </div>

                                   <button type="button" class="AddButton" id="addBtn">+ Add Transaction</button>
                            </div>
                     </div>
              </div>

              <div class = "RecentCard Round">
                     <div class = "Round Label">
                             <p class="WelcomeText"> Recent Entries </p>
                     </div>
                     <div class="EntryList" id="entryList">
                            <p class="EmptyState">No transactions yet — add your first one above.</p>
                     </div>
              </div>

       </div>

       <div class = "Total Round"> 
              <p class="Total-Amount"> 00,00.00$ </p>
              <p class="Total-Amount-Label"> ACCOUNTS TOTAL </p>
       </div>

       <div class = "Nav Round"> 

              <br>
              <br>
              <br>
                     <a href="index.html" style="text-decoration: none; color: inherit;">
                            <div class = " NavButton Round"> 
                                   <img src="Icons/Overview.png" style="width: 40px; height: 40px;" class = "Icon">
                                   Overview
                            </div>
                     </a>

              <br>
              <br>
                     <a href="Trends.html" style="text-decoration: none; color: inherit;">
                            <div class = " NavButton Round"> 
                                   <img src="Icons/Trends.png" style="width: 40px; height: 40px;" class = "Icon">
                                   Trends
                            </div>
                     </a>

              <br>
              <br>
                     <a href="Insights.html" style="text-decoration: none; color: inherit;">
                            <div class = " NavButton Round"> 
                                   <img src="Icons/Insights.png" style="width: 40px; height: 40px;" class = "Icon">
                                   Insights
                            </div>
                     </a>

              <br>
              <br>
                     <a href="Goals.html" style="text-decoration: none; color: inherit;">
                            <div class = " NavButton Round"> 
                                   <img src="Icons/Goals.png" style="width: 40px; height: 40px;" class = "Icon">
                                   Goals
                            </div>
                     </a>

              <br>
              <br>
                     <div class = "Round CurrentPage"> 
                           <img src="Icons/Add.png" style="width: 40px; height: 40px;" class = "Icon">
                            Add
                     </div>

              <br>
              <br>
                        <a href="About.html" style="text-decoration: none; color: inherit;">
                            <div class = " NavButton Round"> 
                                 <img src="Icons/About.png" style="width: 40px; height: 40px;" class = "Icon">
                                 About Us
                            </div>
                        </a>

       </div>

       <div class = "Footer"> 
              <img src="Logos/BBLogoFull.png" style="width: 375px; height: 375px;" class = "Logo">
       </div>

  </div>

       <script src="Main.js"></script>
       <script src="Add.js"></script>
       <script>
        (function () {
          var DESIGN_W = 2475, DESIGN_H = 1320;
          var stage = document.getElementById('scale-stage');
          function fit() {
            var scale = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H);
            stage.style.transform = 'scale(' + scale + ')';
          }
          window.addEventListener('resize', fit);
          fit();
        })();
       </script>
</body>
</html>
